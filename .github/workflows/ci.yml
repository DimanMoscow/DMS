name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Verify checkout source and clean dependency install
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-source-state.mjs --expected "$EXPECTED_SHA" --allow-main

      - name: Verify applied migration ledger is append-only
        env:
          DMS_LEDGER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run verify:migration-history

      - name: Check changed non-Apps-Script-source files for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -d '' files < <(
            git diff --name-only -z "$BASE_SHA"...HEAD -- \
              . \
              ':(exclude)apps-script/versions/**' \
              ':(exclude)apps-script/candidates/**'
          )
          if ((${#files[@]})); then
            git diff --check "$BASE_SHA"...HEAD -- "${files[@]}"
          fi
